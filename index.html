<!DOCTYPE html>
<html>
<head>
  <title>New Tab</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
  </style>
</head>
<body>

<script>
  let launched = false;

  document.addEventListener("click", function() {
    if (launched) return;
    launched = true;

    const pageHtml = [
      '<!DOCTYPE html>',
      '<html><head><title>Mathematics<\/title>',
      '<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}iframe{width:100%;height:100%;border:none;}<\/style>',
      '<\/head><body>',
      '<iframe src="https://amazonaws.com" allow="autoplay; keyboard; gamepad; fullscreen"><\/iframe>',
      '<\/body><\/html>'
    ].join('');

    const blob = new Blob([pageHtml], { type: "text/html" });
    const win = window.open(URL.createObjectURL(blob), "_blank");
    if (!win) {
      alert("Allow pop-ups in your browser bar to open the page!");
      launched = false;
    }
  });
</script>

</body>
</html>
